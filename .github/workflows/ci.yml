name: CI

on:
  push:
    branches: [main]
  # No branch filter: stage branches are stacked, so a PR often targets another stage rather
  # than main. Filtering on main left four stacked PRs with no checks at all.
  pull_request:

permissions:
  contents: read
  # Read-only, and only so the stacked-PR guard below can ask whether this branch is another PR's
  # base. Nothing in CI writes to a pull request.
  pull-requests: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Merging a PR that is the base of another closes the child irrecoverably — GitHub refuses to
      # reopen a pull request whose base branch is gone. That is documented in
      # .claude/rules/stacked-pr-workflow.md because it already happened here once, by hand, with
      # someone watching. Auto-merge fires the same thing unattended, so the check moves from a rule
      # somebody remembers into a gate that blocks.
      #
      # The fix when this fails is to retarget the children to main first, which takes one command
      # and is the ordering that rule already prescribes.
      - name: Refuse to merge a branch another PR is stacked on
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env rather than inline `${{ }}`: a branch name is attacker-controlled on a
          # public repo, and inline interpolation splices it into the shell before the shell ever
          # sees a quote. As `$HEAD_REF` it is one argument whatever it contains.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          children=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --base "$HEAD_REF" --json number --jq 'length')
          if [ "$children" != "0" ]; then
            echo "::error::$children open PR(s) target this branch. Retarget them to main first:"
            gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --base "$HEAD_REF" --json number,title
            exit 1
          fi

      # CLAUDE.md has said "CHANGELOG.md is a release artefact, not an afterthought" since the
      # beginning, and an entire build shipped with an empty changelog anyway. A rule nobody can
      # skip beats a rule everybody agrees with.
      #
      # Keep a Changelog is explicit that internal refactors are not notable, so this has an escape
      # hatch rather than forcing a noise entry: label the PR `no-changelog`. The label is the
      # record of that judgement, which is the point — the decision becomes visible instead of
      # being made silently by omission.
      - name: Require a changelog entry for source changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
               --jq '.labels[].name' | grep -qx 'no-changelog'; then
            echo "Skipped: PR is labelled no-changelog."
            exit 0
          fi
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          if echo "$files" | grep -q '^src/' && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This pull request changes src/ but not CHANGELOG.md."
            echo "Add an entry under ## [Unreleased], or label the PR no-changelog if the change"
            echo "is not notable to a reader of the public surface."
            exit 1
          fi

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Layering
        run: bun run layers

      - name: Dead code
        run: bun run deadcode

      - name: Structure budgets
        run: bun run structure

      - name: Format
        run: bun run format

      - name: Run tests
        run: bun run test

      # Data_Protection_and_Retention.txt:112-113 — run on every release that touches storage.
      - name: Erasure acceptance gate
        run: bun run gate:erasure

  # Deliberately a separate job, and deliberately not a required check.
  #
  # These drive real containers, so they pull images over the network. Inside the job that gates a
  # merge that is a network dependency in a blocking position, which LD-10 calls worse than no gate:
  # one that fires at random teaches people to click through red CI and costs every gate beside it
  # its credibility. The isolation they prove is worth having and is not worth blocking on.
  sandbox:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Sandbox isolation tests
        run: bun run test:sandbox
